name: OryvexSMTP Service & Web Portal

on:
  workflow_dispatch:
    inputs:
      sender_domain:
        description: "Your sender domain (e.g. yourdomain.com)"
        required: false
        default: "yourdomain.com"
        type: string
      test_recipient:
        description: "Test recipient email address"
        required: false
        default: "faketype3@gmail.com"
        type: string
      tunnel_duration:
        description: "Minutes to keep web portal active (e.g. 60; set 0 to run tests and exit)"
        required: false
        default: "60"
        type: string
      smtp_port:
        description: "SMTP port (default 587)"
        required: false
        default: "587"
        type: string
      server_mode:
        description: "Server Mode"
        required: false
        default: "Live"
        type: choice
        options:
          - Live
          - Development

permissions:
  contents: read

jobs:
  postal-smtp:
    name: Run OryvexSMTP & Web Portal (TryCloudflare)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Postal Docker Image
        run: docker compose -f docker-compose.smtp.yml build

      - name: Start Postal SMTP Services (Port ${{ inputs.smtp_port || '587' }})
        env:
          POSTAL_CI_SERVER_MODE: ${{ inputs.server_mode || 'Live' }}
          POSTAL_CI_DOMAIN: ${{ inputs.sender_domain || 'yourdomain.com' }}
          POSTAL_CI_CREDENTIAL_KEY: ${{ secrets.POSTAL_CI_CREDENTIAL_KEY }}
          POSTAL_OUTBOUND_SMTP_PORT: ${{ inputs.smtp_port || '587' }}
        run: |
          docker compose -f docker-compose.smtp.yml up -d
          docker compose -f docker-compose.smtp.yml ps

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify SMTP Server and Send Test Email
        env:
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: ${{ inputs.smtp_port || '587' }}
          SMTP_USERNAME: ci/smtp
          SMTP_PASSWORD: ${{ secrets.POSTAL_CI_CREDENTIAL_KEY || 'postal-ci-key' }}
          SMTP_FROM: test@${{ inputs.sender_domain || 'yourdomain.com' }}
          SMTP_TO: ${{ inputs.test_recipient || 'faketype3@gmail.com' }}
        run: python script/test_smtp_client.py

      - name: Install Cloudflared
        run: |
          echo "Installing Cloudflare Tunnel (cloudflared)..."
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Start OryvexSMTP Web Portal
        env:
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: ${{ inputs.smtp_port || '587' }}
          SMTP_USERNAME: ci/smtp
          SMTP_PASSWORD: ${{ secrets.POSTAL_CI_CREDENTIAL_KEY || 'postal-ci-key' }}
          SMTP_FROM: test@${{ inputs.sender_domain || 'yourdomain.com' }}
          DEFAULT_TO: ${{ inputs.test_recipient || 'faketype3@gmail.com' }}
          WEB_PORT: 8080
          WEB_HOST: 0.0.0.0
        run: |
          echo "Starting web server on port 8080..."
          python3 web/app.py > /tmp/web_portal.log 2>&1 &
          echo "Waiting for web portal to respond..."
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null 2>&1; then
              echo "Web portal is responding on http://127.0.0.1:8080"
              break
            fi
            sleep 1
          done
          curl -I http://127.0.0.1:8080/ || (echo "Web portal failed to respond:"; cat /tmp/web_portal.log && exit 1)
          echo "Web portal started successfully."

      - name: Expose Web Portal via TryCloudflare
        id: tunnel
        run: |
          echo "Establishing Cloudflare Quick Tunnel (trycloudflare.com)..."
          touch /tmp/cloudflared.log /tmp/cloudflared.out
          nohup cloudflared tunnel --url http://127.0.0.1:8080 --logfile /tmp/cloudflared.log --no-autoupdate > /tmp/cloudflared.out 2>&1 &

          echo "Waiting for TryCloudflare tunnel URL..."
          TUNNEL_URL=""
          for i in {1..40}; do
            TUNNEL_URL=$(cat /tmp/cloudflared.log /tmp/cloudflared.out 2>/dev/null | grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" | head -n 1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 1
          done

          if [ -n "$TUNNEL_URL" ]; then
            echo "=========================================================="
            echo "🚀 OryvexSMTP Web Portal is online!"
            echo "URL: $TUNNEL_URL"
            echo "=========================================================="
            echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV

            echo "## 🌐 OryvexSMTP Web Portal is LIVE" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Your web portal is publicly accessible via TryCloudflare:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "👉 **[Open OryvexSMTP Web Portal]($TUNNEL_URL)**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Sender Domain:** \`${{ inputs.sender_domain || 'yourdomain.com' }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Recipient:** \`${{ inputs.test_recipient || 'faketype3@gmail.com' }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **SMTP Port:** \`${{ inputs.smtp_port || '587' }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Server Mode:** \`${{ inputs.server_mode || 'Live' }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Tunnel Duration:** \`${{ inputs.tunnel_duration || '60' }}\` minutes" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Failed to retrieve TryCloudflare URL."
            echo "=== Cloudflared Logs ==="
            cat /tmp/cloudflared.log /tmp/cloudflared.out 2>/dev/null || true
            exit 1
          fi

      - name: Keep Portal Active
        if: ${{ (inputs.tunnel_duration || '60') != '0' }}
        env:
          MINUTES: ${{ inputs.tunnel_duration || '60' }}
        run: |
          echo "Holding runner open for $MINUTES minutes so you can use the web portal..."
          echo "Portal URL: $TUNNEL_URL"
          echo "To stop early, click 'Cancel run' in GitHub Actions."
          sleep $(( MINUTES * 60 ))

      - name: Dump Logs on Failure
        if: failure()
        run: |
          echo "=== Web Portal Logs ==="
          cat /tmp/web_portal.log 2>/dev/null || true
          echo "=== Cloudflared Logs ==="
          cat /tmp/cloudflared.log /tmp/cloudflared.out 2>/dev/null || true
          echo "=== postal-init logs ==="
          docker compose -f docker-compose.smtp.yml logs postal-init
          echo "=== postal-smtp logs ==="
          docker compose -f docker-compose.smtp.yml logs postal-smtp
          echo "=== postal-worker logs ==="
          docker compose -f docker-compose.smtp.yml logs postal-worker
          echo "=== mariadb logs ==="
          docker compose -f docker-compose.smtp.yml logs mariadb

      - name: Stop Postal Services & Cleanup
        if: always()
        run: |
          pkill -f cloudflared || true
          pkill -f "python3 web/app.py" || true
          docker compose -f docker-compose.smtp.yml down -v
