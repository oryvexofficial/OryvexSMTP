name: OryvexSMTP CI Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and run Postal test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build local CI image
        run: docker build --target ci --tag postal-ci:test .

      - name: Run test suite
        env:
          POSTAL_IMAGE: postal-ci:test
        run: docker compose run --rm postal sh -c 'bundle exec rspec'
